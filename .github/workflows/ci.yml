name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an in-flight run obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (JSON backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile's python:3.11-slim base image.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  backend-postgres:
    name: Backend tests (Postgres backend)
    runs-on: ubuntu-latest

    # The storage tests run against real Postgres here, so the JSONB columns and
    # advisory locks that production depends on are exercised on the dialect
    # they actually ship on -- not just on SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: globetrotter
          POSTGRES_PASSWORD: globetrotter
          POSTGRES_DB: globetrotter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run storage tests against Postgres
        env:
          TEST_DATABASE_URL: postgresql://globetrotter:globetrotter@localhost:5432/globetrotter_test
        run: pytest tests/test_store.py -q

      - name: Verify the seed catalogue imports cleanly
        env:
          DATABASE_URL: postgresql://globetrotter:globetrotter@localhost:5432/globetrotter_test
        run: |
          python scripts/migrate_json_to_db.py --data-dir ./data --dry-run
          python scripts/migrate_json_to_db.py --data-dir ./data --replace

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches breakage in the multi-stage build that only shows up at deploy
      # time otherwise -- the image is built, not pushed.
      - name: Build image
        run: docker build -t globetrotter-app:ci .
