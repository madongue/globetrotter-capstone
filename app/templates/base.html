<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "GlobeTrotter" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ url_for('ui.home') }}">GlobeTrotter</a>
        <nav class="site-nav">
          <a href="{{ url_for('ui.home') }}">Home</a>
          <a href="{{ url_for('ui.login_page') }}">Login</a>
          <a href="{{ url_for('ui.register_page') }}">Register</a>
          <a href="{{ url_for('ui.dashboard_page') }}">Dashboard</a>
        </nav>
      </div>
    </header>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>GlobeTrotter – travel planning, shared trips, payments, community groups, and multimedia.</p>
      </div>
    </footer>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  </body>
</html>
